# AudioBook Wizarrd. Start: docker compose up -d --build (im Projektordner, .env daneben)
services:
  abw:
    build:
      context: .
      args:
        EXTRA_PIP: ${ABW_EXTRA_PIP:-}  # zusätzliche Python-Pakete für Erweiterungen
        WHISPER: ${ABW_WHISPER:-0}  # 1 = mit Spracherkennung (Image deutlich grösser)
    image: audiobook-wizarrd:${ABW_TAG:-dev}
    container_name: audiobook-wizarrd
    restart: unless-stopped
    user: "${ABW_UID:-1000}:${ABW_GID:-1000}"  # Besitzer der Bibliotheks- und Download-Ordner
    ports:
      - "8790:8790"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-UTC}
      # Verbindungen lassen sich auch im Setup-Wizard bzw. unter Einstellungen setzen (gehen dann vor)
      ABS_URL: ${ABS_URL:-}
      ABS_PUBLIC_URL: ${ABS_PUBLIC_URL:-}
      ABS_API_KEY_FILE: /run/secrets/abs_api_key
      ABS_LIBRARY_EN: ${ABS_LIBRARY_EN:-}
      ABS_LIBRARY_DE: ${ABS_LIBRARY_DE:-}
      # Quelle Usenet: Suche über Prowlarr, Download über SABnzbd
      PROWLARR_URL: ${PROWLARR_URL:-}
      PROWLARR_API_KEY_FILE: /run/secrets/prowlarr_api_key
      USENET_INDEXER_IDS: ${USENET_INDEXER_IDS:-}
      SABNZBD_URL: ${SABNZBD_URL:-}
      SABNZBD_API_KEY_FILE: /run/secrets/sab_api_key
      SABNZBD_CATEGORY: ${SABNZBD_CATEGORY:-audiobooks}
      # Quelle AudioBookBay: Suche über Prowlarr, Download über qBittorrent in einen eigenen Ordner
      TORRENT_INDEXER_IDS: ${TORRENT_INDEXER_IDS:-}
      EBOOK_TORRENT_INDEXER_IDS: ${EBOOK_TORRENT_INDEXER_IDS:-}
      QBIT_URL: ${QBIT_URL:-}
      QBIT_USERNAME_FILE: /run/secrets/qbit_username
      QBIT_PASSWORD_FILE: /run/secrets/qbit_password
      QBIT_SAVE_ROOT: ${QBIT_SAVE_ROOT:-}
      # Optional: FlareSolverr für Goodreads-Genres und Erweiterungen
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-}
      # Erweiterungen (zusätzliche Quellen), siehe backend/abw/plugins.py
      ABW_PLUGINS_DIR: /plugins
      # Ankunftsprüfung und Ablage
      WHISPER_CACHE: /models/whisper
      HF_HUB_OFFLINE: "1"
      ABW_IMPORT_ENABLED: ${ABW_IMPORT_ENABLED:-0}
      LIBRARY_EN_ROOT: /library-root/${LIBRARY_EN_DIR:-audiobooks-en}
      LIBRARY_DE_ROOT: /library-root/${LIBRARY_DE_DIR:-audiobooks-de}
      LIBRARY_TRASH: /library-root/${LIBRARY_TRASH_DIR:-.abw-trash}
      # Meldungen
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN_FILE: /run/secrets/ntfy_token
      ABW_PUBLIC_URL: ${ABW_PUBLIC_URL:-}
    volumes:
      - ${ABW_DATA:-./data}:/data
      - ${ABS_API_KEY_HOST_FILE:-/dev/null}:/run/secrets/abs_api_key:ro
      - ${PROWLARR_API_KEY_HOST_FILE:-/dev/null}:/run/secrets/prowlarr_api_key:ro
      - ${SAB_API_KEY_HOST_FILE:-/dev/null}:/run/secrets/sab_api_key:ro
      - ${USENET_COMPLETE_HOST:-/dev/null}:/usenet-complete  # schreibbar nur fürs Aufräumen (Papierkorb)
      - ${TORRENT_COMPLETE_HOST:-/dev/null}:/torrent-complete
      - ${QBIT_USERNAME_HOST_FILE:-/dev/null}:/run/secrets/qbit_username:ro
      - ${QBIT_PASSWORD_HOST_FILE:-/dev/null}:/run/secrets/qbit_password:ro
      - ${ABW_PLUGINS_HOST:-/dev/null}:/plugins:ro
      - ${WHISPER_MODELS_HOST:-/dev/null}:/models/whisper:ro
      # Ganze Musik-Freigabe: Bibliotheken und Papierkorb der Umwandlung liegen so auf derselben Platte (Verschieben statt Kopieren)
      - ${MUSIC_ROOT_HOST:-/dev/null}:/library-root
      - ${NTFY_TOKEN_HOST_FILE:-/dev/null}:/run/secrets/ntfy_token:ro
    # Laufen Prowlarr, SABnzbd usw. in anderen Compose-Projekten, ihre Netze in compose.override.yaml ergänzen
