# Bei einem Tag v1.2.3: Images auf GHCR veröffentlichen, schlank und mit Spracherkennung (-whisper).
name: Release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        variant:
          - { suffix: "", whisper: "0" }
          - { suffix: "-whisper", whisper: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          v="${GITHUB_REF_NAME#v}"
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/audiobook-wizarrd"
          echo "tags=${img}:${v}${{ matrix.variant.suffix }},${img}:latest${{ matrix.variant.suffix }}" >> "$GITHUB_OUTPUT"
      - name: Version im Tag und im Code gleich?
        run: grep -q "__version__ = \"${GITHUB_REF_NAME#v}\"" backend/abw/__init__.py
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: WHISPER=${{ matrix.variant.whisper }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
